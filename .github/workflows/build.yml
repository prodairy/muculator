name: Build

# Every push builds Windows + macOS, runs the unit tests, validates the plugin with pluginval
# (auval on macOS, clap-validator for CLAP) and renders every screen to PNG (download them from the
# run's artifacts). The macOS Standalone app is uploaded as Muculator-macOS-Standalone for testing.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the zips attached; tag only when
# the owner asks for a public release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: 0.3.2

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64   # newest installed Visual Studio
      - name: Build
        run: cmake --build build --config Release --target Muculator_VST3 Muculator_CLAP CalcTests MuculatorSnapshot
      - name: Unit tests
        run: build\Release\CalcTests.exe
      - name: Snapshots and smoke test
        run: build\MuculatorSnapshot_artefacts\Release\MuculatorSnapshot.exe "${{ github.workspace }}\shots"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Snapshots-Windows
          path: shots/*.png
      - name: pluginval (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          pluginval\pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate build\Muculator_artefacts\Release\VST3\Muculator.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: pluginval-logs-Windows
          path: pluginval-logs
      - name: clap-validator (CLAP)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/free-audio/clap-validator/releases/download/$env:CLAP_VALIDATOR_VERSION/clap-validator-$env:CLAP_VALIDATOR_VERSION-windows.zip" -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath clap-validator
          $exe = Get-ChildItem clap-validator -Recurse -Filter clap-validator.exe | Select-Object -First 1
          & $exe.FullName validate build\Muculator_artefacts\Release\CLAP\Muculator.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/Muculator_artefacts/Release/VST3/Muculator.vst3 -DestinationPath Muculator-Windows-VST3.zip
          Compress-Archive -Path build/Muculator_artefacts/Release/CLAP/Muculator.clap -DestinationPath Muculator-Windows-CLAP.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Muculator-Windows
          path: Muculator-Windows-*.zip

  macos:
    runs-on: macos-15  # macos-latest jobs got no runner on 2026-10-19
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUCULATOR_INSTALL_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --target Muculator_VST3 Muculator_AU Muculator_CLAP Muculator_Standalone CalcTests MuculatorSnapshot -j 4
      - name: Unit tests
        run: ./build/CalcTests
      - name: Snapshots and smoke test
        run: ./build/MuculatorSnapshot_artefacts/Release/MuculatorSnapshot "$GITHUB_WORKSPACE/shots"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Snapshots-macOS
          path: shots/*.png
      - name: pluginval (VST3)
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            --validate build/Muculator_artefacts/Release/VST3/Muculator.vst3
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: pluginval-logs-macOS
          path: pluginval-logs
      - name: auval (AU)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Muculator_artefacts/Release/AU/Muculator.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Mclc Mucu
      - name: clap-validator (CLAP)
        run: |
          curl -fsSL -o clap-validator.tar.gz "https://github.com/free-audio/clap-validator/releases/download/$CLAP_VALIDATOR_VERSION/clap-validator-$CLAP_VALIDATOR_VERSION-macos-universal.tar.gz"
          mkdir clap-validator && tar -xzf clap-validator.tar.gz -C clap-validator
          "$(find clap-validator -type f -name clap-validator | head -n 1)" validate build/Muculator_artefacts/Release/CLAP/Muculator.clap
      - name: Package
        run: |
          cd build/Muculator_artefacts/Release
          ditto -c -k --keepParent VST3/Muculator.vst3 "$GITHUB_WORKSPACE/Muculator-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Muculator.component "$GITHUB_WORKSPACE/Muculator-macOS-AU.zip"
          ditto -c -k --keepParent CLAP/Muculator.clap "$GITHUB_WORKSPACE/Muculator-macOS-CLAP.zip"
          ditto -c -k --keepParent Standalone/Muculator.app "$GITHUB_WORKSPACE/Muculator-macOS-Standalone.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: Muculator-macOS
          path: Muculator-macOS-*.zip
      # The app on its own, so it is easy to find on the run page for a quick test. Zipped with
      # ditto first: artifacts drop the executable bit of a bare .app.
      - uses: actions/upload-artifact@v5
        with:
          name: Muculator-macOS-Standalone
          path: Muculator-macOS-Standalone.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Muculator-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
