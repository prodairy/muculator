name: Build

# Every push builds Windows + macOS and runs the unit tests.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the zips attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Muculator_VST3 CalcTests
      - name: Unit tests
        run: build\Release\CalcTests.exe
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Muculator_artefacts/Release/VST3/Muculator.vst3 -DestinationPath Muculator-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Muculator-Windows-VST3
          path: Muculator-Windows-VST3.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUCULATOR_INSTALL_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --target Muculator_VST3 Muculator_AU CalcTests -j 4
      - name: Unit tests
        run: ./build/CalcTests
      - name: Package
        run: |
          cd build/Muculator_artefacts/Release
          ditto -c -k --keepParent VST3/Muculator.vst3 "$GITHUB_WORKSPACE/Muculator-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Muculator.component "$GITHUB_WORKSPACE/Muculator-macOS-AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Muculator-macOS
          path: Muculator-macOS-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
